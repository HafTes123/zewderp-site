  choose:"ይህን እቅድ ይምረጡ", r_plan:"እቅድ", r_name:"ስምዎ", r_biz:"የንግድ ስም", r_phone:"ስልክ ቁጥር",
  r_need:"እንድንደውልልዎ እባክዎ ስምዎንና ስልክ ቁጥርዎን ይጻፉ።", r_send_wa:"በዋትስአፕ ላክ", r_send_tg:"በቴሌግራም ላክ", r_send_em:"በኢሜል ላክ", r_send_form:"ቀጥል",
  r_none:"የመገናኛ መረጃችን በቅርቡ ይቀርባል። እባክዎ ቆይተው ይመለሱ።", r_msg:"ሰላም፣ የዘውድ ኤርፒ %plan% እቅድ ፍላጎት አለኝ።",
  best:"በጣም ተመራጭ", per:"/ በወር", yr:"ወይም %s / በዓመት", setup:"የአንድ ጊዜ ማስጀመሪያ፡ %s", users:"ያልተገደበ ተጠቃሚዎችና የራስዎ ሚናዎች", from:"ከ ",
  p_note:"የሙከራ ቅናሽ፡ የመጀመሪያዎቹ 5 ደንበኞች ለ12 ወር 50% ቅናሽና የኢ-ደረሰኝ ግንኙነት ያለ ተጨማሪ ክፍያ ያገኛሉ፤ በምላሹ ሐቀኛ አስተያየት። ማስጀመሪያው ምርቶችን፣ ደንበኞችንና የመክፈቻ ሂሳቦችን መጫንና የአንድ ቀን የሰራተኞች ሥልጠናን ያካትታል።",
  c_h:"እንነጋገር", c_lead:"ስለ ንግድዎ ይንገሩን፤ በራስዎ ምርቶች ነጻ ማሳያ እናዘጋጃለን።", c_empty:"የመገናኛ መረጃ በቅርቡ ይቀርባል።",
  foot:"በኢትዮጵያ፣ ለኢትዮጵያ ንግዶች የተሠራ።" } };
var lang = "en", chosen = "";
try { lang = localStorage.getItem("zewd_lang") || ((navigator.language || "").slice(0,2) === "am" ? "am" : "en"); } catch (e) {}
function fmt(n) { return Number(n).toLocaleString("en-US"); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function render() {
  var t = T[lang]; document.documentElement.lang = lang; document.getElementById("lang").textContent = lang === "en" ? "አማርኛ" : "English";
  document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = t[el.getAttribute("data-t")]; });
  document.getElementById("featgrid").innerHTML = t.feats.map(function (f) { return '<div class="card"><h3>' + esc(f[0]) + '</h3><p>' + esc(f[1]) + '</p></div>'; }).join("");
  document.getElementById("einvlist").innerHTML = t.einv.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("");
  document.getElementById("plans").innerHTML = t.plans.map(function (p, i) {
    var pr = PRICES[p[2]], from = p[2] === "org" ? t.from : "";
    return '<div class="card plan' + (i === 1 ? " best" : "") + (chosen === p[2] ? " chosen" : "") + '" data-plan="' + p[2] + '" tabindex="0" role="button" aria-label="' + esc(t.choose + ": " + p[0]) + '">' + (i === 1 ? '<span class="tag">' + esc(t.best) + '</span>' : "") +
      '<h3>' + esc(p[0]) + '</h3><p>' + esc(p[1]) + '</p><div class="price">' + from + fmt(pr.month) + ' <small>ETB ' + esc(t.per) + '</small></div>' +
      '<p>' + esc(t.yr.replace("%s", "ETB " + fmt(pr.year))) + '</p><ul>' + p[3].map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + '</ul>' +
      '<p>' + esc(t.users) + '</p><p>' + esc(t.setup.replace("%s", "ETB " + fmt(pr.setup))) + '</p><button type="button" class="btn solid pick" tabindex="-1">' + esc(t.choose) + '</button></div>'; }).join("");
  var sel = document.getElementById("r_plan");
  sel.innerHTML = t.plans.map(function (p) { return '<option value="' + p[2] + '"' + (chosen === p[2] ? " selected" : "") + '>' + esc(p[0]) + '</option>'; }).join("");
  if (chosen) sel.value = chosen;
  renderSend();
  var c = [];
  if (CONFIG.phone) c.push('<p><a href="tel:' + esc(CONFIG.phone.replace(/\s/g, "")) + '">' + esc(CONFIG.phone) + '</a></p>');
  if (CONFIG.email) c.push('<p><a href="mailto:' + esc(CONFIG.email) + '">' + esc(CONFIG.email) + '</a></p>');
  if (CONFIG.telegram) c.push('<p>Telegram: <a href="https://t.me/' + esc(CONFIG.telegram.replace("@", "")) + '">' + esc(CONFIG.telegram) + '</a></p>');
  if (CONFIG.address) c.push('<p>' + esc(CONFIG.address) + '</p>');
  document.getElementById("contacts").innerHTML = c.length ? c.join("") : '<p class="muted">' + esc(t.c_empty) + '</p>';
}
document.getElementById("lang").addEventListener("click", function () { lang = lang === "en" ? "am" : "en"; try { localStorage.setItem("zewd_lang", lang); } catch (e) {} render(); });
function planName() { var o = document.getElementById("r_plan"); return o.options[o.selectedIndex] ? o.options[o.selectedIndex].textContent : ""; }
function message() {
  var t = T[lang], f = function (id) { return document.getElementById(id).value.trim(); };
  var lines = [t.r_msg.replace("%plan%", planName())];
  if (f("r_name")) lines.push(t.r_name + ": " + f("r_name"));
  if (f("r_biz")) lines.push(t.r_biz + ": " + f("r_biz"));
  if (f("r_phone")) lines.push(t.r_phone + ": " + f("r_phone"));
  return lines.join("\n");
}
function renderSend() {
  var t = T[lang], box = document.getElementById("r_send"), b = [];
  if (CONFIG.formUrl) b.push(["form", t.r_send_form]);
  if (CONFIG.whatsapp) b.push(["wa", t.r_send_wa]);
  if (CONFIG.telegram) b.push(["tg", t.r_send_tg]);
  if (CONFIG.email) b.push(["em", t.r_send_em]);
  box.innerHTML = b.length ? b.map(function (x) { return '<button type="button" class="btn solid" data-send="' + x[0] + '">' + esc(x[1]) + '</button>'; }).join("")
    : '<p class="muted">' + esc(t.r_none) + '</p>';
}
function send(kind) {
  var t = T[lang], err = document.getElementById("r_err"), v = function (id) { return document.getElementById(id).value.trim(); };
  if (!v("r_name") || !v("r_phone")) { err.textContent = t.r_need; return; }
  err.textContent = "";
  var m = message(), plan = document.getElementById("r_plan").value, url = "", q = encodeURIComponent;
  if (kind === "form") url = CONFIG.formUrl + (CONFIG.formUrl.indexOf("?") < 0 ? "?" : "&") + "plan=" + q(plan) + "&name=" + q(v("r_name")) + "&phone=" + q(v("r_phone")) + "&business=" + q(v("r_biz"));
  if (kind === "wa") url = "https://wa.me/" + CONFIG.whatsapp.replace(/[^0-9]/g, "") + "?text=" + q(m);
  if (kind === "tg") url = "https://t.me/" + CONFIG.telegram.replace("@", "") + "?text=" + q(m);
  if (kind === "em") url = "mailto:" + CONFIG.email + "?subject=" + q("Zewderp - " + planName()) + "&body=" + q(m);
  window.open(url, kind === "em" ? "_self" : "_blank");
}
function choose(plan) {
  chosen = plan; render();
  document.getElementById("req").scrollIntoView({ behavior: "smooth", block: "center" });
  setTimeout(function () { document.getElementById("r_name").focus({ preventScroll: true }); }, 400);
}
document.getElementById("plans").addEventListener("click", function (e) { var c = e.target.closest(".plan"); if (c) choose(c.getAttribute("data-plan")); });
document.getElementById("plans").addEventListener("keydown", function (e) { if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("plan")) { e.preventDefault(); choose(e.target.getAttribute("data-plan")); } });
document.getElementById("r_send").addEventListener("click", function (e) { var b = e.target.closest("[data-send]"); if (b) send(b.getAttribute("data-send")); });
document.getElementById("r_plan").addEventListener("change", function () { chosen = this.value; document.querySelectorAll(".plan").forEach(function (c) { c.classList.toggle("chosen", c.getAttribute("data-plan") === chosen); }); });
document.getElementById("yr").textContent = new Date().getFullYear();
render();
</script>
</body>
